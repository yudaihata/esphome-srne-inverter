esphome:
  name: srne-inverter
  friendly_name: SRNE-Inverter
  comment: 'SRNE Hybrid Inverter – auto-generated'

# プラットフォーム/ボード設定（必要に応じて変更してください）
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# UART/RS485/Modbus設定は環境に合わせて編集してください
uart:
  id: uart_bus
  tx_pin: GPIO5   # 例: ESP32
  rx_pin: GPIO7   # 例: ESP32
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: uart_bus
  send_wait_time: 100ms
  flow_control_pin: GPIO6

modbus_controller:
  - id: srne_main
    address: 1
    modbus_id: modbus1
    command_throttle: 150ms
    max_cmd_retries: 8
    update_interval: ${main_update_interval_s}000ms

# ネットワーク/管理設定（必要に応じて編集してください）
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: 'srne-inverter-setup'
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# 時刻同期（HA優先 / SNTPフォールバック）: DateTime 同期ボタン用
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

logger:
  level: INFO

# System entities (diagnostic / connectivity)
sensor:
  - platform: uptime
    name: "ESP Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    id: wifi_rssi_db
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
    unit_of_measurement: dBm
  - platform: copy
    source_id: wifi_rssi_db
    name: "WiFi Signal"
    unit_of_measurement: "%"
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x <= -100.0f) return 0.0f;
          if (x >= -50.0f) return 100.0f;
          return (x + 100.0f) * 2.0f;

  - platform: internal_temperature
    name: "ESP32 Temperature"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      entity_category: diagnostic
    mac_address:
      name: "WiFi MAC Address"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

button:
  - platform: restart
    name: "ESP Restart"
    entity_category: diagnostic

switch:
  - platform: restart
    name: "ESP Restart Switch"
    entity_category: diagnostic
