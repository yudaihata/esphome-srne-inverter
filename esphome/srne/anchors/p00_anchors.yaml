        uint16_t raw = ((uint16_t)data[2] << 8) | data[3];
        id(sens_p00_31).publish_state((float) raw);
      }
      if ((size_t)5 < data.size()) {
        uint16_t v = ((uint16_t)data[4] << 8) | data[5];
        switch (v) {
          case 0: id(txt_p00_32).publish_state("Shenzhen"); break;
          case 1: id(txt_p00_32).publish_state("Dongguan"); break;
          default: id(txt_p00_32).publish_state("unknown"); break;
        }
      }
      if ((size_t)7 < data.size()) {
