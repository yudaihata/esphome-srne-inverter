    force_new_range: true
    address: 527
    register_count: 29
    lambda: |-
      // Distribute 16-bit words to per-register template sensors
      if ((size_t)1 < data.size()) {
        uint16_t raw = ((uint16_t)data[0] << 8) | data[1];
        id(sens_p02_527).publish_state((float) raw);
      }
      if ((size_t)3 < data.size()) {
        uint16_t v = ((uint16_t)data[2] << 8) | data[3];
        switch (v) {
          case 0: id(txt_p02_528).publish_state("Initialization"); break;
          case 1: id(txt_p02_528).publish_state("Standby state"); break;
          case 2: id(txt_p02_528).publish_state("AC power operation"); break;
          case 3: id(txt_p02_528).publish_state("Inverter operation"); break;
          case 4: id(txt_p02_528).publish_state("AC power operation"); break;
          case 5: id(txt_p02_528).publish_state("Inverter operation"); break;
          case 6: id(txt_p02_528).publish_state("Inverter to AC power"); break;
          case 7: id(txt_p02_528).publish_state("AC power to inverter"); break;
          case 8: id(txt_p02_528).publish_state("Battery activation"); break;
          case 9: id(txt_p02_528).publish_state("Manual shutdown"); break;
          case 10: id(txt_p02_528).publish_state("Fault"); break;
          default: id(txt_p02_528).publish_state("unknown"); break;
        }
      }
      if ((size_t)5 < data.size()) {
        uint16_t v = ((uint16_t)data[4] << 8) | data[5];
        switch (v) {
          case 0: id(txt_p02_529).publish_state("Users have not entered password"); break;
          case 1: id(txt_p02_529).publish_state("The password of users is entered"); break;
          case 4: id(txt_p02_529).publish_state("The password of the manufacturer is entered"); break;
          default: id(txt_p02_529).publish_state("unknown"); break;
