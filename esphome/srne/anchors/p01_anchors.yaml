sensor:
  # Anchor for P01 range 1 (0x0100-0x0103, size=4)
  - platform: modbus_controller
    modbus_controller_id: srne_main
    name: "P01 Anchor 1"
    internal: true
    register_type: holding
    skip_updates: ${p01_skip_updates}
    force_new_range: true
    address: 256
    register_count: 4
    lambda: |-
      // Distribute 16-bit words to per-register template sensors
      if ((size_t)1 < data.size()) {
        uint16_t raw = ((uint16_t)data[0] << 8) | data[1];
        id(sens_p01_256).publish_state((float) raw);
      }
      if ((size_t)3 < data.size()) {
        uint16_t raw = ((uint16_t)data[2] << 8) | data[3];
        id(sens_p01_257).publish_state((float) raw * 0.1);
      }
      if ((size_t)5 < data.size()) {
        int16_t raw = (int16_t)(((uint16_t)data[4] << 8) | data[5]);
        id(sens_p01_258).publish_state((float) raw * -0.1);
      }
      if ((size_t)7 < data.size()) {
        int16_t raw = (int16_t)(((uint16_t)data[6] << 8) | data[7]);
        id(sens_p01_259).publish_state((float) raw * 0.1);
      }
      return 0;
