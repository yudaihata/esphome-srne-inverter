        uint16_t raw = ((uint16_t)data[6] << 8) | data[7];
        id(sens_p01_266).publish_state((float) raw);
      }
      if ((size_t)9 < data.size()) {
        uint16_t v = ((uint16_t)data[8] << 8) | data[9];
        id(sens_p01_267).publish_state((float) v);
      }
