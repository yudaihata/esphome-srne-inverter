number:
  - platform: modbus_controller
    id: num_p03_57088
    modbus_controller_id: srne_main
    internal: true
    register_type: holding
    skip_updates: ${p03_skip_updates}
    force_new_range: true
    address: 57088
    value_type: U_WORD
    write_lambda: |-
      return (int) x;
  - platform: modbus_controller
    id: num_p03_57089
    modbus_controller_id: srne_main
    internal: true
    register_type: holding
    skip_updates: ${p03_skip_updates}
    force_new_range: true
    address: 57089
    value_type: U_WORD
    write_lambda: |-
      return (int) x;
  - platform: modbus_controller
    id: num_p03_57090
    modbus_controller_id: srne_main
    internal: true
    register_type: holding
    skip_updates: ${p03_skip_updates}
    force_new_range: true
    address: 57090
    value_type: U_WORD
    write_lambda: |-
      return (int) x;
  - platform: modbus_controller
    id: num_p03_57094
    modbus_controller_id: srne_main
    internal: true
    register_type: holding
    skip_updates: ${p03_skip_updates}
