globals:
  - id: p03_write_actions_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(p03_write_actions_enabled) && millis() > 3000U) id(p03_write_actions_enabled) = true;
