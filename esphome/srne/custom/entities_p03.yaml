button:
  - platform: template
    name: "ON⁄OFF Control On"
    entity_category: config
    internal: true
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(p03_write_actions_enabled);'
            then:
              - lambda: |-
                  auto controller = id(srne_main);
                  controller->queue_command(
                      esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                          controller, 57088, 1));
