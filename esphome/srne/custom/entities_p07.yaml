globals:
  - id: p07_fast_poll_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: p07_write_actions_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(p07_write_actions_enabled) && millis() > 3000U) id(p07_write_actions_enabled) = true;
