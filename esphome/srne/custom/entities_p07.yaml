select:
  - platform: modbus_controller
    modbus_controller_id: srne_main
    skip_updates: ${p07_skip_updates}
    address: 57857
    # endianness: register=big, word=little
    id: sel_p07_57857
    name: "Parallel_Mode"
    force_new_range: true
    entity_category: config
    optimistic: true
    on_value:
      - lambda: |-
          static std::string prev = "";
          if (prev == x) return;
          prev = x;
          id(p07_fast_poll_until_ms) = millis() + 15000U;
    optionsmap:
      "Single machine": 0
      "Single-phase parallel": 1
      "Two-phase parallel": 2
      "Two-phase parallel 120": 3
      "Two-phase parallel 180": 4
      "Three-phase A": 5
      "Three-phase B": 6
      "Three-phase C": 7
