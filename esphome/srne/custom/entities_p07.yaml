switch:
  - platform: template
    id: sw_p07_57862
    name: "Equalization Charge"
    optimistic: true
    restore_mode: DISABLED
    entity_category: config
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(p07_write_actions_enabled);'
          then:
            - lambda: |-
                id(p07_fast_poll_until_ms) = millis() + 15000U;
            - number.set:
                id: num_p07_57862
                value: 1
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(p07_write_actions_enabled);'
          then:
            - lambda: |-
                id(p07_fast_poll_until_ms) = millis() + 15000U;
            - number.set:
                id: num_p07_57862
                value: 0
