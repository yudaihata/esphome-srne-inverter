text_sensor:
  - platform: modbus_controller
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p07_skip_updates}
    address: 57882
    # endianness: register=big, word=little
    name: "Generator_Charge_Inhibit"
    lambda: |-
      int v = 0;
      if (!x.empty()) v = atoi(x.c_str());
      switch (v) {
        case 0: return std::string("Enable");
        case 1: return std::string("Disable");
        default: return std::string("unknown");
      }

