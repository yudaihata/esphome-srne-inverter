
sensor:
  - platform: modbus_controller
    id: sens_p07_57862
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p07_skip_updates}
    internal: true
    force_new_range: true
    address: 57862
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            id(p07_write_actions_enabled) = true;
        - if:
            condition:
              lambda: 'return x > 0.5;'
            then:
              - switch.template.publish:
                  id: sw_p07_57862
                  state: ON
            else:
              - switch.template.publish:
