text_sensor:
  - platform: template
    id: production_date
    name: "Production_Date"
    entity_category: diagnostic
    lambda: |-
      uint16_t ym = (uint16_t) id(sens_p00_30).state;
      uint16_t dh = (uint16_t) id(sens_p00_31).state;
      if ((ym == 0xFFFF && dh == 0xFFFF) || (ym == 0 && dh == 0)) { return std::string("Not Set"); }
      int year = 2000 + ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      if (month < 1 || month > 12 || day < 1 || day > 31) { return std::string("Not Set"); }
      char buf[24];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:00", year, month, day, hour);
      return std::string(buf);
  - platform: modbus_controller
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p00_skip_updates}
    address: 11
    # endianness: register=big, word=little
    name: "Product_Type"
    lambda: |-
      int v = 0;
      if (!x.empty()) v = atoi(x.c_str());
      switch (v) {
        case 0: return std::string("Domestic Controller");
        case 1: return std::string("Controller For Street Light");
        case 3: return std::string("Grid-Connected Inverter");
        case 4: return std::string("All-In-One Solar Charger Inverter");
        case 5: return std::string("Power Frequency Off-Grid");
        default: return std::string("unknown");
      }
  - platform: modbus_controller
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p00_skip_updates}
    address: 32
    # endianness: register=big, word=little
    name: "Production_Site_Code"
    lambda: |-
      int v = 0;
      if (!x.empty()) v = atoi(x.c_str());
      switch (v) {
        case 0: return std::string("Shenzhen");
        case 1: return std::string("Dongguan");
        default: return std::string("unknown");
      }
    entity_category: diagnostic
  - platform: template
    id: txt_p00_ver_20
    name: "APP_Version"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(sens_p00_20).state)) return std::string("Unknown");
      int raw = (int) roundf(id(sens_p00_20).state);
      if (raw <= 0 || raw > 9999) return std::string("Unknown");
      int major = raw / 100;
      int minor = raw % 100;
      char buf[16];
      snprintf(buf, sizeof(buf), "V%d.%02d", major, minor);
      return std::string(buf);
