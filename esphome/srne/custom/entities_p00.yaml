  - platform: template
    id: production_date
    name: "Production_Date"
    entity_category: diagnostic
    lambda: |-
      uint16_t ym = (uint16_t) id(sens_p00_30).state;
      uint16_t dh = (uint16_t) id(sens_p00_31).state;
      if ((ym == 0xFFFF && dh == 0xFFFF) || (ym == 0 && dh == 0)) { return std::string("Not Set"); }
      int year = 2000 + ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      if (month < 1 || month > 12 || day < 1 || day > 31) { return std::string("Not Set"); }
      char buf[24];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:00", year, month, day, hour);
      return std::string(buf);
  - platform: template
    id: txt_p00_11
    name: "Product Type"
  - platform: template
    id: txt_p00_32
    name: "Production Site Code"
  - platform: template
    id: txt_p00_raw_26
    name: "Controller_Device_Address"
    lambda: |-
      if (isnan(id(sens_p00_26).state)) return std::string("Unknown");
      long long raw = llroundf(id(sens_p00_26).state);
      if (raw > 999999999LL || raw < -999999999LL) return std::string("Unknown");
      char buf[24];
      snprintf(buf, sizeof(buf), "%lld", raw);
      return std::string(buf);
