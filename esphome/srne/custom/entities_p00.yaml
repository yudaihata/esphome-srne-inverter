text_sensor:
  - platform: template
    id: app_version
    name: "APP_Version"
    entity_category: diagnostic
    lambda: |-
      float value = id(sens_p00_20).state;
      if (isnan(value)) { return {}; }
      if (value <= 0.0f || value >= 655.35f) { return std::string("Not Set"); }
      char buf[16];
      snprintf(buf, sizeof(buf), "%.2f", value);
      return std::string(buf);
  - platform: template
    id: bootloader_version
    name: "BOOTLOADER_Version"
    entity_category: diagnostic
    lambda: |-
      float value = id(sens_p00_21).state;
      if (isnan(value)) { return {}; }
