text_sensor:
  - platform: template
    id: p09_equalization_time
    name: "Last Equalization Time"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (isnan(id(p09_eq_time_ym).state) || isnan(id(p09_eq_time_dh).state) || isnan(id(p09_eq_time_ms).state)) { return std::string("Unknown"); }
      uint16_t ym = (uint16_t) id(p09_eq_time_ym).state;
      uint16_t dh = (uint16_t) id(p09_eq_time_dh).state;
      uint16_t ms = (uint16_t) id(p09_eq_time_ms).state;
      if ((ym == 0xFFFF && dh == 0xFFFF && ms == 0xFFFF) || (ym == 0 && dh == 0 && ms == 0)) { return std::string("Not Set"); }
      int year = 2000 + ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      int minute = ((ms >> 8) & 0xFF);
      int second = (ms & 0xFF);
      if (month < 1 || month > 12 || day < 1 || day > 31 || hour < 0 || hour > 23 || minute < 0 || minute > 59 || second < 0 || second > 59) { return std::string("Invalid"); }
      char buf[20];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d", year, month, day, hour, minute, second);
      return std::string(buf);
  - platform: template
    id: p09_uptime_text
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (isnan(id(p09_uptime_ym).state) || isnan(id(p09_uptime_dh).state) || isnan(id(p09_uptime_ms).state)) { return std::string("Unknown"); }
      uint16_t ym = (uint16_t) id(p09_uptime_ym).state;
      uint16_t dh = (uint16_t) id(p09_uptime_dh).state;
      uint16_t ms = (uint16_t) id(p09_uptime_ms).state;
      int year = ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      int minute = ((ms >> 8) & 0xFF);
      int second = (ms & 0xFF);
      if (month < 0 || month > 12 || day < 0 || day > 31 || hour < 0 || hour > 23 || minute < 0 || minute > 59 || second < 0 || second > 59) { return std::string("Invalid"); }
      char buf[32];
      snprintf(buf, sizeof(buf), "%02dy %02dmo %02dd %02d:%02d:%02d", year, month, day, hour, minute, second);
      return std::string(buf);
