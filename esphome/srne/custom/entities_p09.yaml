  - platform: modbus_controller
    id: sens_p09_61490_hi
    modbus_controller_id: srne_main
    internal: true
    register_type: holding
    skip_updates: ${p09_skip_updates}
    address: 61491
    value_type: U_WORD
    force_new_range: true
  - platform: template
    id: sens_p09_61490
    name: "Total_Grid_Export"
    unit_of_measurement: "kWh"
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
    lambda: |-
      uint32_t lo = (uint32_t) id(sens_p09_61490_lo).state;
      uint32_t hi = (uint32_t) id(sens_p09_61490_hi).state;
      uint32_t u32 = (hi << 16) | (lo & 0xFFFF);
      // Guard against reboot-time spikes for long-term total counters.
      static bool init_done = false;
      static uint32_t last_u32 = 0;
      if (millis() < 60000U) { return {}; }
      if (!init_done) {
        init_done = true;
        last_u32 = u32;
        return {};
      }
      if (u32 < last_u32) { return {}; }
      uint32_t delta = u32 - last_u32;
      if (delta > 50000U) { return {}; }
      last_u32 = u32;
      return (float)u32 * 0.1;
  - platform: modbus_controller
