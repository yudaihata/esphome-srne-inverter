  - platform: template
    id: total_battery_charge_energy_estimated
    name: "Total_Battery_Charge_Energy_Estimated"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float ah = id(sens_p09_61492).state;
      if (isnan(ah)) return {};
      float std_v = NAN;
      std::string bt = id(sel_p05_57348).current_option();
      if (bt == "User define") return {};
      if (!bt.empty()) {
        if (bt == "LFP x14") std_v = 44.8f;
        else if (bt == "LFP x15") std_v = 48.0f;
        else if (bt == "LFP x16") std_v = 51.2f;
        else if (bt == "LFP x7") std_v = 22.4f;
        else if (bt == "LFP x8") std_v = 25.6f;
        else if (bt == "LFP x9") std_v = 28.8f;
        else if (bt == "NMC x7") std_v = 25.9f;
        else if (bt == "NMC x8") std_v = 29.6f;
        else if (bt == "NMC x13") std_v = 48.1f;
        else if (bt == "NMC x14") std_v = 51.8f;
      }
      if (isnan(std_v)) {
        std::string rv_s = id(sel_p05_57347).current_option();
        if (!rv_s.empty()) {
          int rv = atoi(rv_s.c_str());
          if (rv == 12 || rv == 24 || rv == 36 || rv == 48) std_v = (float) rv;
        }
      }
      if (isnan(std_v) || std_v <= 0.0f) return {};
      return (ah * std_v) / 1000.0f;
