
sensor:
  - platform: template
    id: sens_p01_256
    name: "Battery_SoC"
    unit_of_measurement: "%"
    accuracy_decimals: 0

  - platform: template
    id: sens_p01_257
    name: "Battery_Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement

  - platform: template
    id: sens_p01_258
    name: "Battery_Current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    id: sens_p01_259
    name: "Battery_Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    id: sens_p01_263
    name: "PV1_Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement

  - platform: template
    id: sens_p01_264
    name: "PV1_Current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    id: sens_p01_265
    name: "PV1_Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    id: sens_p01_266
    name: "PV_Total_Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    id: sens_p01_270
    name: "Battery_Charge_Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    id: sens_p01_271
    name: "PV2_Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement

  - platform: template
    id: sens_p01_272
    name: "PV2_Current"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement

  - platform: template
    id: sens_p01_273
    name: "PV2_Power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    id: sens_p01_267
    internal: true
  - platform: template
    id: battery_power
    name: "Battery_Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(sens_p01_257).state) || isnan(id(sens_p01_258).state)) return {};
      return id(sens_p01_257).state * id(sens_p01_258).state;

text_sensor:
  - platform: template
    id: txt_p01_267
    name: "Charge_Status"
    lambda: |-
      uint16_t v = (uint16_t) id(sens_p01_267).state;
      switch (v) {
        case 0: return std::string("Charge off");
        case 1: return std::string("Quick charge");
        case 2: return std::string("Const voltage charge");
        case 4: return std::string("Float charge");
        case 5: return std::string("Reserved");
        case 6: return std::string("Li battery activate");
        case 8: return std::string("Full");
        default: {
          char buf[16]; snprintf(buf, sizeof(buf), "0x%02X", v & 0xFF);
          return std::string(buf);
        }
      }
