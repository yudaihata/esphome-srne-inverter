  - platform: modbus_controller
    id: sens_p01_267
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p01_skip_updates}
    internal: true
    address: 267
    value_type: U_WORD
  - platform: template
    id: battery_power
    name: "Battery_Power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (isnan(id(sens_p01_257).state) || isnan(id(sens_p01_258).state)) return {};
      return id(sens_p01_257).state * id(sens_p01_258).state;

text_sensor:
  - platform: template
    id: txt_p01_267
    name: "Charge_Status"
    lambda: |-
      uint16_t v = (uint16_t) id(sens_p01_267).state;
      switch (v) {
        case 0: return std::string("Charge off");
        case 1: return std::string("Quick charge");
        case 2: return std::string("Const voltage charge");
        case 4: return std::string("Float charge");
        case 5: return std::string("Reserved");
        case 6: return std::string("Li battery activate");
        case 8: return std::string("Full");
        default: {
          char buf[16]; snprintf(buf, sizeof(buf), "0x%02X", v & 0xFF);
          return std::string(buf);
        }
      }
