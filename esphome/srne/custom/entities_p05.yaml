script:
  - id: p05_refresh_after_write
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          auto controller = id(srne_main);
          if (controller == nullptr) return;
          controller->queue_command(
              esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  controller, esphome::modbus_controller::ModbusRegisterType::HOLDING,
                  57345, 32));
          controller->queue_command(
              esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  controller, esphome::modbus_controller::ModbusRegisterType::HOLDING,
                  57378, 18));
          controller->queue_command(
              esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  controller, esphome::modbus_controller::ModbusRegisterType::HOLDING,
                  57399, 3));

globals:
  - id: p05_write_actions_enabled
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(p05_write_actions_enabled) && millis() > 3000U) id(p05_write_actions_enabled) = true;
