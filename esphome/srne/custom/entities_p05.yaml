text_sensor:
  - platform: template
    id: txt_p05_range_57382_57383
    name: "Slot 1 Charging Time Range"
    entity_category: config
    lambda: |-
      if (isnan(id(raw_p05_57382).state) || isnan(id(raw_p05_57383).state)) return {};
      int s = (int) llroundf(id(raw_p05_57382).state);
      int e = (int) llroundf(id(raw_p05_57383).state);
      int sh = (s >> 8) & 0xFF; int sm = s & 0xFF;
      int eh = (e >> 8) & 0xFF; int em = e & 0xFF;
      if (sh < 0 || sh > 23 || eh < 0 || eh > 23 || sm < 0 || sm > 59 || em < 0 || em > 59) return {};
      char buf[24];
      snprintf(buf, sizeof(buf), "%02d:%02d-%02d:%02d", sh, sm, eh, em);
      return std::string(buf);
