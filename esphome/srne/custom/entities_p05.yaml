    # endianness: register=big, word=little
    name: "Battery-to-Grid_Switch_Voltage"
    unit_of_measurement: "V"
    entity_category: config
    min_value: 9
    max_value: 62
    step: 0.1
    lambda: |-
      if (id(sel_p05_57347).current_option().empty()) return NAN;
      int rv = atoi(id(sel_p05_57347).current_option().c_str());
      if (!(rv == 12 || rv == 24 || rv == 36 || rv == 48)) return NAN;
      float ratio = ((float) rv) / 12.0f;
      return x * 0.1 * ratio;
    write_lambda: |-
      if (id(sel_p05_57347).current_option().empty()) {
        ESP_LOGW("p05_voltage", "Battery_Rated_Voltage unavailable, block write");
        return {};
      }
      int rv = atoi(id(sel_p05_57347).current_option().c_str());
      if (!(rv == 12 || rv == 24 || rv == 36 || rv == 48)) {
        ESP_LOGW("p05_voltage", "Battery_Rated_Voltage invalid (%d), block write", rv);
        return {};
      }
      float ratio = ((float) rv) / 12.0f;
      float min_v = 9.0 * ratio;
      float max_v = 15.5 * ratio;
      if (!isnan(min_v) && x < min_v) {
        ESP_LOGW("p05_voltage", "Input %.3fV below min %.3fV, block write", x, min_v);
        return {};
      }
      if (!isnan(max_v) && x > max_v) {
        ESP_LOGW("p05_voltage", "Input %.3fV above max %.3fV, block write", x, max_v);
        return {};
      }
      id(p05_refresh_after_write).execute();
      return (int) floorf(x / ratio * 10.0);
