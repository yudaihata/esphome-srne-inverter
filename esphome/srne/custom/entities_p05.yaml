
sensor:
  - platform: modbus_controller
    id: sens_p05_57388
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p05_skip_updates}
    internal: true
    address: 57388
    value_type: U_WORD
    on_value:
      then:
        - lambda: |-
            id(p05_write_actions_enabled) = true;
        - if:
            condition:
              lambda: 'return x > 0.5;'
            then:
              - switch.template.publish:
                  id: sw_p05_57388
                  state: ON
            else:
              - switch.template.publish:
                  id: sw_p05_57388
                  state: OFF
