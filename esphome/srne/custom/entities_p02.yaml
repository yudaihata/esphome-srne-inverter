text_sensor:
  - platform: template
    id: sys_datetime_text
    name: "System DateTime"
    lambda: |-
      if (isnan(id(sys_datetime_ym).state) || isnan(id(sys_datetime_dh).state) || isnan(id(sys_datetime_ms).state)) {
        return {};
      }
      uint16_t ym = (uint16_t) id(sys_datetime_ym).state;
      uint16_t dh = (uint16_t) id(sys_datetime_dh).state;
      uint16_t ms = (uint16_t) id(sys_datetime_ms).state;
      int year = 2000 + ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      int minute = ((ms >> 8) & 0xFF);
      int second = (ms & 0xFF);
      char buf[20];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d", year, month, day, hour, minute, second);
      return {buf};
  - platform: template
    id: txt_p02_516
    name: "Active Fault Code 0"
    entity_category: diagnostic
    lambda: |-
      uint16_t v = (uint16_t) id(sens_p02_516).state;
      switch (v) {
        case 0: return std::string("No Active Fault");
        case 1: return std::string("Battery Undervoltage Alarm");
        case 2: return std::string("Battery Discharge Overcurrent Protection (Software)");
        case 3: return std::string("Battery Disconnection Fault");
        case 4: return std::string("Battery End of Discharge Protection");
        case 5: return std::string("Battery Overcurrent Protection (Hardware)");
        case 6: return std::string("Battery Charge Overvoltage Protection");
        case 7: return std::string("DC Link Overvoltage Protection (Hardware)");
        case 8: return std::string("DC Link Overvoltage Protection (Software)");
        case 9: return std::string("PV Input Overvoltage Protection");
        case 10: return std::string("PV Boost Stage Overcurrent Protection (Software)");
        case 11: return std::string("PV Boost Stage Overcurrent Protection (Hardware)");
        case 12: return std::string("SPI Communication Fault");
        case 13: return std::string("Bypass Output Overload Protection");
        case 14: return std::string("Inverter Output Overload Protection");
        case 15: return std::string("Inverter Output Overcurrent Protection (Hardware)");
        case 16: return std::string("Slave DSP PWM Shutdown Request Fault");
        case 17: return std::string("Inverter Output Short Circuit Protection");
        case 18: return std::string("DC Link Soft Start Failure");
        case 19: return std::string("MPPT Heatsink Overtemperature Protection");
        case 20: return std::string("Inverter Heatsink Overtemperature Protection");
        case 21: return std::string("Cooling Fan Failure Fault");
        case 22: return std::string("EEPROM Memory Fault");
        case 23: return std::string("Model Configuration Fault");
        case 24: return std::string("DC Link Voltage Imbalance Fault");
        case 25: return std::string("DC Link Short Circuit Protection");
        case 26: return std::string("AC Output Relay Short Circuit Fault");
        case 28: return std::string("AC Input Phase Sequence Error");
        case 29: return std::string("DC Link Undervoltage Protection");
        case 30: return std::string("Battery Capacity Low Alarm (10%)");
        case 31: return std::string("Battery Capacity Critical Alarm (5%)");
        case 32: return std::string("Battery Capacity Shutdown Protection");
        case 34: return std::string("Parallel System CAN Communication Fault");
