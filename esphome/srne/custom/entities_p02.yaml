button:
  - platform: template
    id: sync_sys_datetime_now
    name: "Sync System DateTime"
    icon: mdi:clock-check
    entity_category: config
    on_press:
      then:
        - lambda: |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) t = id(sntp_time).now();
            if (!t.is_valid()) return;
            ESP_LOGI("datetime", "Sync now -> %04d-%02d-%02d %02d:%02d:%02d", t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
        - lambda: |-
            auto t2 = id(ha_time).now();
            if (!t2.is_valid()) t2 = id(sntp_time).now();
            if (!t2.is_valid()) return;
            uint16_t ym = ((uint16_t)((t2.year - 2000) & 0xFF) << 8) | (uint16_t)(t2.month & 0xFF);
            uint16_t dh = ((uint16_t)(t2.day_of_month & 0xFF) << 8) | (uint16_t)(t2.hour & 0xFF);
            uint16_t ms = ((uint16_t)(t2.minute & 0xFF) << 8) | (uint16_t)(t2.second & 0xFF);
            std::vector<uint16_t> words; words.reserve(3);
            words.push_back(ym); words.push_back(dh); words.push_back(ms);
            auto controller = id(srne_main);
            if (controller == nullptr) return;
            esphome::modbus_controller::ModbusCommandItem set_rtc_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 0x020C, 3, words);
            controller->queue_command(set_rtc_command);
            // Reflect to internal numbers for immediate UI coherence
            id(sys_datetime_ym).publish_state((float) ym);
            id(sys_datetime_dh).publish_state((float) dh);
            id(sys_datetime_ms).publish_state((float) ms);
        - delay: 400ms
        - component.update: sys_datetime_text

number:
  - platform: modbus_controller
    modbus_controller_id: srne_main
    register_type: holding
    skip_updates: ${p02_skip_updates}
    address: 524
    value_type: U_WORD
    id: sys_datetime_ym
    internal: true
    name: "System DateTime Year Month"
    min_value: 0
    max_value: 65535
    write_lambda: |-
      return (int) x;
  - platform: modbus_controller
