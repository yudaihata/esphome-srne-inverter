text_sensor:
  - platform: template
    id: fault_record_1_text
    name: "Fault Record 01"
    update_interval: 600s
    lambda: |-
      uint16_t code = (uint16_t) id(fr1_off00).state;
      uint16_t ym = (uint16_t) id(fr1_off01).state;
      uint16_t dh = (uint16_t) id(fr1_off02).state;
      uint16_t ms = (uint16_t) id(fr1_off03).state;
      if (code == 0 || code == 0xFFFF) { return std::string("Not Set"); }
      if ((ym == 0xFFFF && dh == 0xFFFF && ms == 0xFFFF) || (ym == 0 && dh == 0 && ms == 0)) { return std::string("Not Set"); }
      const char *code_text = "Unknown";
      switch (code) {
        case 1: code_text = "Battery Undervoltage Alarm"; break;
        case 2: code_text = "Battery Discharge Overcurrent Protection (Software)"; break;
        case 3: code_text = "Battery Disconnection Fault"; break;
        case 4: code_text = "Battery End of Discharge Protection"; break;
        case 5: code_text = "Battery Overcurrent Protection (Hardware)"; break;
        case 6: code_text = "Battery Charge Overvoltage Protection"; break;
        case 7: code_text = "DC Link Overvoltage Protection (Hardware)"; break;
        case 8: code_text = "DC Link Overvoltage Protection (Software)"; break;
        case 9: code_text = "PV Input Overvoltage Protection"; break;
        case 10: code_text = "PV Boost Stage Overcurrent Protection (Software)"; break;
        case 11: code_text = "PV Boost Stage Overcurrent Protection (Hardware)"; break;
        case 12: code_text = "SPI Communication Fault"; break;
        case 13: code_text = "Bypass Output Overload Protection"; break;
        case 14: code_text = "Inverter Output Overload Protection"; break;
        case 15: code_text = "Inverter Output Overcurrent Protection (Hardware)"; break;
        case 16: code_text = "Slave DSP PWM Shutdown Request Fault"; break;
        case 17: code_text = "Inverter Output Short Circuit Protection"; break;
        case 18: code_text = "DC Link Soft Start Failure"; break;
        case 19: code_text = "MPPT Heatsink Overtemperature Protection"; break;
        case 20: code_text = "Inverter Heatsink Overtemperature Protection"; break;
        case 21: code_text = "Cooling Fan Failure Fault"; break;
        case 22: code_text = "EEPROM Memory Fault"; break;
        case 23: code_text = "Model Configuration Fault"; break;
        case 24: code_text = "DC Link Voltage Imbalance Fault"; break;
        case 25: code_text = "DC Link Short Circuit Protection"; break;
        case 26: code_text = "AC Output Relay Short Circuit Fault"; break;
        case 28: code_text = "AC Input Phase Sequence Error"; break;
        case 29: code_text = "DC Link Undervoltage Protection"; break;
        case 30: code_text = "Battery Capacity Low Alarm (10%)"; break;
        case 31: code_text = "Battery Capacity Critical Alarm (5%)"; break;
        case 32: code_text = "Battery Capacity Shutdown Protection"; break;
        case 34: code_text = "Parallel System CAN Communication Fault"; break;
        case 35: code_text = "Parallel System Address Configuration Fault"; break;
        case 37: code_text = "Parallel System Current Sharing Fault"; break;
        case 38: code_text = "Parallel System Battery Voltage Mismatch Fault"; break;
        case 39: code_text = "Parallel System AC Source Inconsistency Fault"; break;
        case 40: code_text = "Parallel System Hardware Synchronization Fault"; break;
        case 41: code_text = "Inverter DC Link Voltage Fault"; break;
        case 42: code_text = "Parallel System Firmware Version Mismatch Fault"; break;
        case 43: code_text = "Parallel System Connection Fault"; break;
        case 44: code_text = "Serial Number Configuration Fault"; break;
        case 45: code_text = "Split Phase Mode Configuration Fault"; break;
        case 56: code_text = "PV Insulation Resistance Fault"; break;
        case 57: code_text = "Residual Current Protection Fault"; break;
        case 58: code_text = "BMS Communication Fault"; break;
        case 60: code_text = "BMS Undervoltage Temperature Alarm"; break;
        case 61: code_text = "BMS Overtemperature Alarm"; break;
        case 62: code_text = "BMS Overcurrent Alarm"; break;
        case 63: code_text = "BMS Undervoltage Alarm"; break;
        case 64: code_text = "BMS Overvoltage Alarm"; break;
        default: break;
      }
      int year = 2000 + ((ym >> 8) & 0xFF);
      int month = (ym & 0xFF);
      int day = ((dh >> 8) & 0xFF);
      int hour = (dh & 0xFF);
      int minute = ((ms >> 8) & 0xFF);
      int second = (ms & 0xFF);
      if (month < 1 || month > 12 || day < 1 || day > 31 || hour > 23 || minute > 59 || second > 59) { return std::string("Not Set"); }
      char buf[160];
      snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d | C%u | %s", year, month, day, hour, minute, second, code, code_text);
      return std::string(buf);
